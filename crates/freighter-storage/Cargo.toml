[package]
name = "freighter-storage"
version.workspace = true
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
# enable unstable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
freighter-api-types = { workspace = true, features = ["storage"] }
anyhow = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
aws-credential-types = { workspace = true, features = ["hardcoded-credentials"] }
aws-sdk-s3 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
# Real BLAKE3 content-addressed storage, backed by sangdb (hashtrinity::Table) -- the same durable
# store `lore-storage`'s own ImmutableStore/MutableStore now stand on, not a second, separate
# iroh-blobs store this crate would otherwise have to keep in sync with it by hand.
#
# Pinned to Tasmanian-Cloud/lore @ 4bffa76b (the lore fork this crate is built against). The
# previous sibling-directory path layout (`../../../lore/lore-storage`) was unresolvable in a
# standalone checkout; the git dep makes the build hermetic. Bump the rev when the lore fork
# gets a stable tag.
lore-storage = { git = "https://github.com/Tasmanian-Cloud/lore.git", rev = "4bffa76bc782a6ed7354111ac3e733db2aec50c9", path = "lore-storage", optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
lore = ["dep:lore-storage"]

[lints]
workspace = true
